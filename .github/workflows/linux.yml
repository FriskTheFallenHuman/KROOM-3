name: Linux
on:
  workflow_call:
    inputs:
      build_type:
        type: string
        default: Release
      compilers:
        description: JSON array of compilers to build with (the first gcc leg is packaged)
        type: string
        default: '["gcc"]'
      simd_levels:
        description: >-
          JSON array of x86 instruction set levels (CMake SIMD_LEVEL) to build, any of sse2, sse3, sse41, avx, avx2.
          Only gcc builds every level, the other compilers build the first one.
        type: string
        default: '["sse2"]'
      retention_days:
        type: number
        default: 1
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        options: [Release, RelWithDebInfo, Debug]
        default: Release
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'assets/**', 'platform/**', '.github/workflows/windows.yml', '.github/workflows/nightly.yml']
  pull_request:
    paths-ignore: ['**.md', 'assets/**', 'platform/**', '.github/workflows/windows.yml', '.github/workflows/nightly.yml']

concurrency:
  group: linux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: 1500M
  CCACHE_NOHASHDIR: "true"

jobs:
  plan:
    name: Plan build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Compilers x instruction set levels
        id: matrix
        env:
          COMPILERS: ${{ inputs.compilers || '["gcc","clang"]' }}
          LEVELS: ${{ inputs.simd_levels || '["sse2"]' }}
        run: |
          matrix="$(jq -cn --argjson compilers "$COMPILERS" --argjson levels "$LEVELS" \
            '{include: [ $compilers[] as $c | $levels[] as $l | select( $c == "gcc" or $l == $levels[0] ) | {compiler: $c, simd: $l} ]}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  build:
    name: ${{ matrix.compiler }} ${{ matrix.simd }} (${{ inputs.build_type || 'Release' }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON( needs.plan.outputs.matrix ) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build pkgconf ccache nasm \
            libsdl2-dev libsdl2-image-dev libopenal-dev \
            libgl1-mesa-dev libwxgtk3.2-dev \
            libzstd-dev zlib1g-dev libx11-dev libxext-dev

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"   >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.compiler }}-${{ matrix.simd }}-${{ env.BUILD_TYPE }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ matrix.compiler }}-${{ matrix.simd }}-${{ env.BUILD_TYPE }}-

      - name: Configure
        run: |
          ccache --zero-stats
          cmake -S neo -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSIMD_LEVEL=${{ matrix.simd }} \
            -DUSE_PRECOMPILED_HEADERS=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Check SIMD objects for leaked instructions
        if: matrix.simd == 'sse2'
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys
          bad = []
          for level in ('SSE41', 'AVX', 'AVX2'):
              obj = f'build/idlib/CMakeFiles/idLib.dir/math/Simd_{level}.cpp.o'
              weak = {l.split()[2] for l in subprocess.run(['nm', obj], capture_output=True, text=True, check=True).stdout.splitlines()
                      if len(l.split()) == 3 and l.split()[1] in 'WVwv'}
              dis = subprocess.run(['objdump', '-d', '--no-show-raw-insn', obj], capture_output=True, text=True, check=True).stdout
              for block in re.split(r'\n(?=[0-9a-f]+ <)', dis):
                  m = re.match(r'[0-9a-f]+ <([^>]+)>:', block)
                  if m and m.group(1) in weak and re.search(r'\n\s+[0-9a-f]+:\s+(v[a-z0-9]+|blendvps|dpps)\s', block):
                      bad.append(f'{level}: {m.group(1)}')
          print('leaked:', bad or 'none')
          sys.exit(1 if bad else 0)
          EOF

      - name: Check renderer modules
        run: |
          ls -l bin/x86_64/ref_neo_opengl*.dll
          if readelf -d bin/x86_64/ref_neo_*.dll | grep -i NEEDED | grep -qi openal; then
            echo "Why the fuck are we linking OpenAL?"; exit 1
          fi

      - name: ccache statistics
        if: always()
        run: ccache --show-stats --verbose || true

      - name: Save ccache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.compiler }}-${{ matrix.simd }}-${{ env.BUILD_TYPE }}-${{ github.run_id }}

      - name: Package
        if: matrix.compiler == 'gcc'
        id: package
        run: |
          stamp="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          name="Kroom3BFG-linux-x86_64-${{ matrix.simd }}-${stamp}"
          mkdir -p "dist/${name}"
          cp -a bin/x86_64/. "dist/${name}/"
          cp -a platform "dist/${name}/platform"
          cp .github/LICENSE.md .github/LICENSE_EXCEPTIONS.md "dist/${name}/"
          strip --strip-unneeded "dist/${name}/Kroom3BFG" "dist/${name}/"ref_neo_*.dll "dist/${name}/base/"*.so || true
          tar -C dist -czf "${name}.tar.gz" "${name}"
          echo "file=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          ls -lh "${name}.tar.gz"

      - name: Upload artifact
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: kroom3-linux-x86_64-${{ matrix.simd }}
          path: ${{ steps.package.outputs.file }}
          retention-days: ${{ inputs.retention_days || 3 }}
          compression-level: 0
          if-no-files-found: error
