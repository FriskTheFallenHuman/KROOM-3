//
// Version enforcement
//
set r_glVersionMajor "4"
set r_glVersionMinor "2"

//
// Basics
//
set r_antiAliasing "2"
set r_useHighQualitySky "1"
set r_maxAnisotropicFiltering "8"
set r_useTrilinearFiltering "1"
set image_highQualityCompression "0"
set rs_enable "0"
set r_forceShadowMapsOnAlphaTestedSurfaces "0"

//
// Eye Candy
//
set r_usePBR "1"
set r_useLightGrid "1"
set r_useHDR "1"
set r_useHalfLambertLighting "0"
set r_useFilmicPostProcessing "0"
set r_useSSAO "0"
set r_hdrAutoExposure "0"
set r_tonemapPreset "0"
set r_motionBlur "0"

//
// Shadow Maps
//
set r_shadowMapJitterScale "3"
set r_shadowMapSamples "8"
set r_shadowMapLodScale "0.4"
set r_shadowMapLodBias "2"

//
// Game Eye Candy
//
set g_showPlayerShadow "0"
set g_muzzleFlash "1"
set g_projectileLights "1"