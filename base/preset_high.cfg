//
// Version enforcement
//
set r_glVersionMajor "4"
set r_glVersionMinor "5"

//
// Basics
//
set r_antiAliasing "3"
set r_useHighQualitySky "1"
set r_maxAnisotropicFiltering "8"
set r_useTrilinearFiltering "1"
set image_highQualityCompression "1"
set rs_enable "0"
set r_forceShadowMapsOnAlphaTestedSurfaces "1"

//
// Eye Candy
//
set r_usePBR "1"
set r_useLightGrid "1"
set r_useHDR "1"
set r_useHalfLambertLighting "1"
set r_useFilmicPostProcessing "1"
set r_useSSAO "0"
set r_hdrAutoExposure "0"
set r_tonemapPreset "1"
set r_motionBlur "0"

//
// Shadow Maps
//
set r_shadowMapJitterScale "2.5"
set r_shadowMapSamples "16"
set r_shadowMapLodScale "1.4"
set r_shadowMapLodBias "0"

//
// Game Eye Candy
//
set g_showPlayerShadow "1"
set g_muzzleFlash "1"
set g_projectileLights "1"